<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-192.png" />
    <link rel="apple-touch-icon" href="/app-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fc" />
    <meta name="description" content="Red Lantern Payment Studio — create, preview, print, and manage your cheques in one workspace." />
    <script>
      try {
        const saved = localStorage.getItem('red-lantern-theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }

      // Auto-reload once if a stale chunk fails to load after a new deployment
      window.addEventListener('error', function(e) {
        var msg = e && (e.message || (e.error && e.error.message)) || '';
        if (msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('Loading chunk') !== -1) {
          var key = 'cheque_chunk_reload_' + Math.floor(Date.now() / 60000);
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            window.location.reload();
          }
        }
      });
    </script>
    <title>Red Lantern · Payment Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
